<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Expense Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-title">
        <h1>🎓 Student Expense Tracker</h1>
        <p>Track your budget, stay on top of daily expenses</p>
      </div>
      <button id="themeToggle" class="btn-secondary" title="Toggle Dark/Light Mode">🌙 Theme</button>
    </header>

    <!-- Overview Cards -->
    <div class="stats-grid">
      <div class="card stat-card">
        <span class="stat-label">Monthly Budget</span>
        <div class="stat-value-group">
          <span class="stat-currency">$</span>
          <span id="budgetDisplay" class="stat-value">500.00</span>
          <button id="editBudgetBtn" class="icon-btn" title="Edit Budget">✏️</button>
        </div>
      </div>

      <div class="card stat-card">
        <span class="stat-label">Total Spent</span>
        <div class="stat-value-group">
          <span class="stat-currency">$</span>
          <span id="totalSpent" class="stat-value spent">0.00</span>
        </div>
      </div>

      <div class="card stat-card">
        <span class="stat-label">Remaining Balance</span>
        <div class="stat-value-group">
          <span class="stat-currency">$</span>
          <span id="remainingBalance" class="stat-value positive">500.00</span>
        </div>
      </div>
    </div>

    <!-- Budget Progress Bar -->
    <div class="card progress-card">
      <div class="progress-info">
        <span>Budget Usage</span>
        <span id="budgetPercent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill" style="width: 0%"></div>
      </div>
      <p id="budgetAlert" class="budget-alert-text"></p>
    </div>

    <!-- Main Content: Form + List -->
    <div class="main-layout">
      <!-- Add Expense Form -->
      <section class="card form-section">
        <h2>➕ Add New Expense</h2>
        <form id="expenseForm">
          <div class="form-group">
            <label for="title">Title / Description</label>
            <input type="text" id="title" placeholder="e.g. Lunch at Cafeteria" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="amount">Amount ($)</label>
              <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required />
            </div>

            <div class="form-group">
              <label for="category">Category</label>
              <select id="category" required>
                <option value="Food & Dining">🍔 Food & Dining</option>
                <option value="Books & Study">📚 Books & Study</option>
                <option value="Rent & Utilities">🏠 Rent & Utilities</option>
                <option value="Travel & Commute">🚌 Travel & Commute</option>
                <option value="Entertainment">🎬 Entertainment</option>
                <option value="Personal & Others">🛍️ Personal & Others</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required />
          </div>

          <button type="submit" class="btn-primary">Add Expense</button>
        </form>
      </section>

      <!-- Expense List & Filter -->
      <section class="card list-section">
        <div class="list-header">
          <h2>📋 Expense History</h2>
          <div class="list-actions">
            <select id="filterCategory" class="filter-select">
              <option value="all">All Categories</option>
              <option value="Food & Dining">Food & Dining</option>
              <option value="Books & Study">Books & Study</option>
              <option value="Rent & Utilities">Rent & Utilities</option>
              <option value="Travel & Commute">Travel & Commute</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Personal & Others">Personal & Others</option>
            </select>
            <button id="exportCsvBtn" class="btn-secondary btn-sm" title="Download CSV">📥 Export</button>
          </div>
        </div>

        <div class="table-container">
          <table class="expense-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Title</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="expenseListBody">
              <!-- Rendered via JS -->
            </tbody>
          </table>
          <p id="emptyMessage" class="empty-message">No expenses recorded yet. Start by adding one above!</p>
        </div>
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
